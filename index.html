<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Babi — A Love Letter</title>
  <meta name="description" content="A scroll-driven interactive love letter experience.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Caveat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==========================================
       SECTION 1: HERO
       ========================================== -->
  <header class="hero" id="hero">
    <div class="floating-minion minion-hero reveal-item">
      <img src="Assets/MinionsPicture forDesign/minion-bello.jpg" alt="Minion Bello" loading="lazy">
    </div>

    <div class="hero-heart-container reveal-item">
      <span class="hero-heart font-allura">♡</span>
    </div>
    <h1 class="hero-title reveal-item">Hi, babi.</h1>
    <p class="hero-subtitle reveal-item">I made something for you.</p>
    <p class="hero-prompt reveal-item">Scroll slowly.</p>
    
    <div class="scroll-indicator reveal-item">
      <div class="scroll-line">
        <div class="scroll-line-inner"></div>
      </div>
    </div>
  </header>

  <main class="experience">
    <!-- ==========================================
         SECTION 2: PHOTO CHAPTERS
         ========================================== -->
    <div class="chapters-container">

      <!-- CHAPTER 1: Variant A (Full-Screen Focus + Grid) -->
      <section class="chapter" id="chapter-1" style="position: relative;">
        <div class="floating-minion minion-ch1 reveal-item">
          <img src="Assets/MinionsPicture forDesign/minion-bleh.jpg" alt="Minion Bleh" loading="lazy">
        </div>
        <div class="layout-variant-a">
          <div class="photo-block-main reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch1-01.jpg" alt="Photo 01" loading="lazy" width="600" height="800">
            </div>
          </div>

          <div class="photo-grid-sub">
            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch1-02.jpg" alt="Photo 02" loading="lazy" width="300" height="375">
              </div>
            </div>

            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch1-03.jpg" alt="Photo 03" loading="lazy" width="300" height="375">
              </div>
            </div>

            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch1-04.jpg" alt="Photo 04" loading="lazy" width="300" height="375">
              </div>
            </div>

            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch1-05.jpg" alt="Photo 05" loading="lazy" width="300" height="375">
              </div>
            </div>
          </div>

          <div class="photo-block-main reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch1-06.jpg" alt="Photo 06" loading="lazy" width="600" height="800">
            </div>
          </div>
        </div>
      </section>

      <!-- CHAPTER 2: Variant B (Overlapping Dual Cards) -->
      <section class="chapter" id="chapter-2" style="position: relative;">
        <div class="floating-minion minion-ch2 reveal-item">
          <img src="Assets/MinionsPicture forDesign/minion-heart.jpg" alt="Minion Heart" loading="lazy">
        </div>
        <div class="layout-variant-b">
          <div class="photo-block-primary reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch2-01.jpg" alt="Photo 07" loading="lazy" width="500" height="667">
            </div>
          </div>

          <div class="photo-block-secondary reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch2-02.jpg" alt="Photo 08" loading="lazy" width="400" height="500">
            </div>
          </div>

          <div class="photo-block-tertiary reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch2-03.jpg" alt="Photo 09" loading="lazy" width="720" height="405">
            </div>
          </div>

          <div class="photo-block-primary reveal-item" style="margin-top: 4rem;">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch2-04.jpg" alt="Photo 10" loading="lazy" width="500" height="667">
            </div>
          </div>

          <div class="photo-block-secondary reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch2-05.jpg" alt="Photo 11" loading="lazy" width="400" height="500">
            </div>
          </div>

          <div class="photo-block-tertiary reveal-item" style="margin-top: 3rem;">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch2-06.jpg" alt="Photo 12" loading="lazy" width="720" height="405">
            </div>
          </div>
        </div>
      </section>

      <!-- CHAPTER 3: Variant C (Asymmetrical 2-Column Grid) -->
      <section class="chapter" id="chapter-3" style="position: relative;">
        <div class="floating-minion minion-ch3 reveal-item">
          <img src="Assets/MinionsPicture forDesign/minion-dave.jpg" alt="Minion Dave" loading="lazy">
        </div>
        <div class="layout-variant-c">
          <div class="photo-block-col1">
            <div class="photo-frame photo-frame-tall reveal-item">
              <img src="Assets/Pictures/ch3-01.jpg" alt="Photo 13" loading="lazy" width="450" height="600">
            </div>
            <div class="photo-frame photo-frame-square reveal-item">
              <img src="Assets/Pictures/ch3-02.jpg" alt="Photo 14" loading="lazy" width="450" height="450">
            </div>
            <div class="photo-frame photo-frame-tall reveal-item">
              <img src="Assets/Pictures/ch3-03.jpg" alt="Photo 15" loading="lazy" width="450" height="600">
            </div>
          </div>

          <div class="photo-block-col2">
            <div class="photo-frame photo-frame-square reveal-item">
              <img src="Assets/Pictures/ch3-04.jpg" alt="Photo 16" loading="lazy" width="350" height="350">
            </div>
            <div class="photo-frame photo-frame-tall reveal-item">
              <img src="Assets/Pictures/ch3-05.jpg" alt="Photo 17" loading="lazy" width="350" height="467">
            </div>
            <div class="photo-frame photo-frame-square reveal-item">
              <img src="Assets/Pictures/ch3-06.jpg" alt="Photo 18" loading="lazy" width="350" height="350">
            </div>
          </div>
        </div>
      </section>

      <!-- CHAPTER 4: Variant A Composition with Overlapping -->
      <section class="chapter" id="chapter-4" style="position: relative;">
        <div class="floating-minion minion-ch4 reveal-item">
          <img src="Assets/MinionsPicture forDesign/minion-3.jpg" alt="Minion 3" loading="lazy">
        </div>
        <div class="layout-variant-a">
          <div class="photo-block-main reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch4-01.jpg" alt="Photo 19" loading="lazy" width="600" height="800">
            </div>
          </div>

          <div class="photo-grid-sub">
            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch4-02.jpg" alt="Photo 20" loading="lazy" width="300" height="375">
              </div>
            </div>

            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch4-03.jpg" alt="Photo 21" loading="lazy" width="300" height="375">
              </div>
            </div>

            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch4-04.jpg" alt="Photo 22" loading="lazy" width="300" height="375">
              </div>
            </div>

            <div class="photo-block reveal-item">
              <div class="photo-frame">
                <img src="Assets/Pictures/ch4-05.jpg" alt="Photo 23" loading="lazy" width="300" height="375">
              </div>
            </div>
          </div>

          <div class="photo-block-main reveal-item">
            <div class="photo-frame">
              <img src="Assets/Pictures/ch4-06.jpg" alt="Photo 24" loading="lazy" width="600" height="800">
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- ==========================================
         SECTION 3.6: TRANSITION BEAT
         ========================================== -->
    <section class="transition-beat" id="transition-beat" style="position: relative;">
      <div class="floating-minion minion-transition reveal-item">
        <img src="Assets/MinionsPicture forDesign/minion-blergh.jpg" alt="Minion Blergh" loading="lazy">
      </div>
      <div class="transition-beat-line reveal-item"></div>
      <p class="transition-beat-text reveal-item">and then there's everything I never said out loud</p>
    </section>

    <!-- ==========================================
         SECTION 4: CONTINUOUS LETTER
         ========================================== -->
    <section class="letter-section" id="letter-section">
      <div class="letter-header reveal-item">
        <span class="letter-subtitle">Unspoken Words</span>
        <h2 class="letter-title font-allura">My Letter to You</h2>
      </div>

      <div class="letter-content" id="letter-content">
        <!-- Rendered dynamically or hydrated by script.js -->
      </div>
    </section>

    <!-- ==========================================
         SECTION 5: FINAL SECTION
         ========================================== -->
    <section class="final-section" id="final-section">
      <!-- Long Silent Dark Stretch -->
      <div class="silence-stretch"></div>

      <!-- Word-by-Word Reveal -->
      <div class="reveal-experience" id="reveal-experience">
        <div class="word-by-word-container">
          <span class="reveal-word">I</span>
          <span class="reveal-word">love</span>
          <span class="reveal-word">you</span>
          <span class="reveal-word accent-word">so much.</span>
        </div>

        <div class="final-closing" id="final-closing">
          <span class="final-heart font-allura">♡</span>
          <h2 class="final-title font-allura">Forever.</h2>
          <p class="final-signature">— Ardee</p>
        </div>
      </div>

      <div class="fade-to-black-end"></div>
    </section>
  </main>

  <!-- Custom JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
